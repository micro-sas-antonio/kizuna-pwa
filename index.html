<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170d1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kizuna 2.0 by VŌLVA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div class="bgimg" id="bgimg"></div>
  <header class="top">
    <div class="pair" id="topPair"><i class="a" id="avA">M</i><i class="b" id="avB">A</i></div>
    <div class="ttl"><b id="coupleName">Nós dois</b><small id="topSub">Nível 1</small></div>
    <button class="flame" id="flame" type="button" aria-label="Sequência de dias">🔥 <b id="streakN">1</b></button>
  </header>

  <main id="main">
    <section class="view" id="v-inicio"></section>
    <section class="view" id="v-jardim" hidden></section>
    <section class="view" id="v-roleta" hidden></section>
    <section class="view" id="v-noite" hidden></section>
    <section class="view" id="v-perfil" hidden></section>
  </main>

  <nav class="nav" id="nav">
    <button type="button" data-v="inicio" class="on"><span>🏠</span>Início</button>
    <button type="button" data-v="jardim"><span>🌸</span>Jardim</button>
    <button type="button" data-v="roleta"><span>🎡</span>Roletas</button>
    <button type="button" data-v="noite"><span>🎬</span>Noite</button>
    <button type="button" data-v="perfil"><span>👤</span>Perfil</button>
  </nav>

  <div id="page" class="page" hidden></div>
  <div id="sheetHost"></div>
  <div id="fx" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script src="flores.js"></script>
<script src="pools.js"></script>
<script src="dados.js"></script>
<script src="roletas.js"></script>
<script src="app.js"></script>
<script src="features.js"></script>
</body>
</html>
